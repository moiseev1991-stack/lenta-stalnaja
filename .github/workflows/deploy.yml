name: Deploy to SpaceWeb via SSH

# Triggers:
#   - every push to main branch
#   - manual run from GitHub тЖТ Actions тЖТ "Run workflow"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.FTP_HOST }}
          username: ${{ secrets.SSH_USER || secrets.FTP_USER }}
          # Accepts SSH_PASSWORD / FTP_PASSWORD / SSH_KEY тАФ whichever is set
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # Stop on first error
          script_stop: true
          script: |
            set -e
            APP="${{ secrets.DEPLOY_DIR }}"
            cd "$APP"

            echo "==> git pull"
            git pull origin main

            echo "==> stamp deploy sha"
            git rev-parse --short HEAD > .deploy_sha 2>/dev/null || true

            echo "==> npm ci"
            npm ci --omit=dev

            echo "==> run DB migrations"
            node -e "require('./src/db/mysql_migrate').runMysqlMigrations().then(()=>{ console.log('migrations ok'); process.exit(0); }).catch(e=>{ console.error('migration error:', e.message); process.exit(0); })"

            echo "==> import SEO texts"
            node scripts/import_seo_texts.js || echo "SEO import skipped (non-fatal)"

            echo "==> restart"
            # pkill -x matches exact process name "node", never matches this bash script
            pkill -x node 2>/dev/null || true
            sleep 2
            rm -f ~/node.sock
            setsid bash "$APP/start_node.sh" </dev/null >/dev/null 2>&1 &
            sleep 5

            # Пингуем Яндекс.Вебмастер о свежем sitemap.
            # Google убрал sitemap-ping ещё в 2023-м, там ничего не пингуем.
            # Errors non-fatal — деплой не должен падать из-за яндекс-эндпоинта.
            echo "==> ping Yandex Webmaster sitemap"
            curl -sS --max-time 10 \
              "https://webmaster.yandex.ru/ping?sitemap=https://lenta-stalnaja.ru/sitemap.xml" \
              -o /dev/null -w "yandex ping: HTTP %{http_code}\n" \
              || echo "Yandex ping failed (non-fatal)"

            echo "==> Done: $(date)"
