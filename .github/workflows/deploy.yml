name: Deploy to SpaceWeb via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          # FTP_PATH must be a path RELATIVE to the FTP root (e.g. "/" or "/myproject/")
          # Do NOT set it to an absolute server path like /home/i/user/ — FTP already starts there
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/*.db
            data/*.db-shm
            data/*.db-wal
            images*.zip
            images_new_extract/**
            .env
            *.log
            server.err
