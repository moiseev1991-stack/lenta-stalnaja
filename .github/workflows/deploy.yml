name: Deploy to SpaceWeb via SSH

# Triggers:
#   - every push to main branch
#   - manual run from GitHub → Actions → "Run workflow"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.FTP_HOST }}
          username: ${{ secrets.SSH_USER || secrets.FTP_USER }}
          # Accepts SSH_PASSWORD / FTP_PASSWORD / SSH_KEY — whichever is set
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # Stop on first error
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_DIR }}"

            echo "==> git pull"
            git pull origin main

            echo "==> npm ci"
            npm ci --omit=dev

            echo "==> restart app"
            pkill -f "node src/app.js" || true
            sleep 2
            nohup node src/app.js >> ~/node_app.log 2>&1 &
            echo "==> Started PID $! at $(date)"
