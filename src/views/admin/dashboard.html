{% extends "admin/layout.html" %}
{% block title %}Дашборд — Админка{% endblock %}
{% block content %}
<div class="adm-page-header">
  <h1 class="adm-page-title">Дашборд</h1>
</div>
<div class="adm-card">
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
    <a href="/admin/products" style="display:flex;flex-direction:column;gap:0.25rem;padding:1rem;background:#f9f9f9;border:1px solid #eee;border-radius:8px;text-decoration:none;color:inherit;">
      <span style="font-size:2rem;font-weight:700;color:#2563eb;">{{ productsCount }}</span>
      <span style="color:#555;font-size:0.875rem;">Товаров</span>
    </a>
    <a href="/admin/categories" style="display:flex;flex-direction:column;gap:0.25rem;padding:1rem;background:#f9f9f9;border:1px solid #eee;border-radius:8px;text-decoration:none;color:inherit;">
      <span style="font-size:2rem;font-weight:700;color:#22a243;">{{ gradesCount }}</span>
      <span style="color:#555;font-size:0.875rem;">Категорий (марок)</span>
    </a>
  </div>
</div>
{% endblock %}
