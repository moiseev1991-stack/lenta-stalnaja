{# Необязательное вложение к заявке. Форма должна быть с enctype="multipart/form-data". Лимиты: src/middleware/leadUpload.js #}
<div class="form-group lead-file">
  <label>Прикрепить файл (необязательно)</label>
  <input type="file" name="files" class="input" multiple accept=".pdf,.doc,.docx,.rtf,.odt,.txt,.xls,.xlsx,.csv,.ods,.ppt,.pptx,.jpg,.jpeg,.png,.dwg,.dxf,.zip,.rar,.7z">
  <small class="form-hint">До 3 файлов, каждый до 5 МБ: PDF, Word, Excel, чертежи, изображения, архивы.</small>
</div>
