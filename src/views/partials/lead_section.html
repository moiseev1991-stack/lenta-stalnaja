<section class="lead-section" id="lead">
  <div class="lead-info-block">
    <h3 class="lead-info-title">Документы</h3>
    <div class="lead-info-chips">
      <a href="/download/price" class="lead-chip" download>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Прайс-лист (PDF)
      </a>
      <a href="/download/certificates" class="lead-chip" download>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Сертификаты качества
      </a>
    </div>
  </div>

  <div class="lead-info-block">
    <h3 class="lead-info-title">Работаем с</h3>
    <div class="lead-info-chips">
      <span class="lead-chip lead-chip--static">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Производственные компании
      </span>
      <span class="lead-chip lead-chip--static">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Юридические лица
      </span>
      <span class="lead-chip lead-chip--static">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Работаем по договору
      </span>
      <span class="lead-chip lead-chip--static">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        ГОСТ, сертификаты
      </span>
    </div>
  </div>
  <div class="lead-cta">
    <div class="lead-bonus">
      <span class="lead-bonus__icon" aria-hidden="true">🎁</span>
      <span class="lead-bonus__text">Бонус до <b>10%</b> на первый заказ — оставьте заявку сегодня</span>
    </div>
    <div class="lead-countdown" data-countdown aria-live="polite">
      <span class="lead-countdown__label">До конца акции:</span>
      <span class="lead-countdown__clock"><span data-cd-h>00</span>:<span data-cd-m>00</span>:<span data-cd-s>00</span></span>
    </div>
    <a href="/contacts/#lead" class="btn btn-primary btn-lg lead-cta__btn">Оставить заявку</a>
  </div>
</section>

<script>
(function () {
  if (window.__leadCountdownInit) return;
  window.__leadCountdownInit = true;
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    var els = document.querySelectorAll('[data-countdown]');
    if (!els.length) return;
    var now = new Date();
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    var diff = Math.max(0, Math.floor((end - now) / 1000));
    var h = Math.floor(diff / 3600);
    var m = Math.floor((diff % 3600) / 60);
    var s = diff % 60;
    els.forEach(function (el) {
      var eh = el.querySelector('[data-cd-h]');
      var em = el.querySelector('[data-cd-m]');
      var es = el.querySelector('[data-cd-s]');
      if (eh) eh.textContent = pad(h);
      if (em) em.textContent = pad(m);
      if (es) es.textContent = pad(s);
    });
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
