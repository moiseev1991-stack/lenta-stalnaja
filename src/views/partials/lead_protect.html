{# Защита формы заявки от ботов. Класть внутрь <form> (в конце). Логика: src/services/leadGuard.js #}
<input type="hidden" name="form_token" value="{{ leadFormToken() }}">
<div class="lead-hp" aria-hidden="true">
  <label>Не заполняйте это поле <input type="text" name="hp_url" tabindex="-1" autocomplete="off"></label>
</div>
{% if recaptchaSiteKey %}
<input type="hidden" name="recaptcha_token" value="">
<script src="https://www.google.com/recaptcha/api.js?render={{ recaptchaSiteKey }}" async defer></script>
<script>
(function () {
  if (window.__leadCaptchaInit) return;
  window.__leadCaptchaInit = true;
  var KEY = '{{ recaptchaSiteKey }}';
  var lastAt = 0;
  // Токен reCAPTCHA v3 живёт 2 минуты. Берём его заранее и обновляем, а не при нажатии «Отправить»:
  // так он лежит в форме при любой отправке, в том числе когда форму отправляет сторонний скрипт
  // (например, счётчик Roistat) в обход события submit.
  function refresh() {
    if (!window.grecaptcha || !grecaptcha.ready) return;
    grecaptcha.ready(function () {
      grecaptcha.execute(KEY, { action: 'lead' }).then(function (t) {
        lastAt = Date.now();
        var fields = document.querySelectorAll('input[name="recaptcha_token"]');
        for (var i = 0; i < fields.length; i++) fields[i].value = t;
      }, function () {});
    });
  }
  function start() { refresh(); setInterval(refresh, 90000); }
  if (document.readyState === 'complete') start(); else window.addEventListener('load', start);
  // Вкладка долго простояла в фоне или посетитель дошёл до формы позже — обновляем токен при входе в поле.
  document.addEventListener('focusin', function (e) {
    if (e.target && e.target.form && Date.now() - lastAt > 60000) refresh();
  });
})();
</script>
<p class="lead-captcha-note">Форма защищена Google reCAPTCHA: действуют
  <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Политика конфиденциальности</a> и
  <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Условия использования</a> Google.</p>
{% endif %}
